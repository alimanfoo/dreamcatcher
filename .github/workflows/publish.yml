name: Publish

# Uploads each published GitHub release to PyPI. PyPI trusts this workflow and
# the pypi environment by name, so the repository holds no token.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # hatch-vcs reads the version from the release tag in the full history.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      # A tag that is not v followed by the package version would publish
      # whatever version hatch-vcs derives from it.
      - name: Check the version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in "dreamcatcher-$version.tar.gz" "dreamcatcher-$version-py3-none-any.whl"; do
            if [ ! -f "dist/$file" ]; then
              echo "::error::Tag $GITHUB_REF_NAME did not build dist/$file"
              ls dist
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dreamcatcher
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      # A re-run after a partial upload skips the files PyPI already holds.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
