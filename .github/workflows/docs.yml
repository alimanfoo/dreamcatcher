name: Docs

# Publishes the documentation site from main. The repository checks already
# build the same site in strict mode on every pull request, so this workflow
# adds no check of its own.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a deployment still waiting to run, but never cancels
# one already under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --locked
      - run: uv run mkdocs build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Only the deploy job publishes, so only it may write to Pages and ask for the
  # token that proves where the site came from. The build job runs third-party
  # code and holds neither.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
