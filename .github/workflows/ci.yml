name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The test and checks jobs take their interpreter from .python-version. The
  # package job takes whatever uvx picks, which is what a user installing the
  # tool gets.
  test:
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked
      - name: Keep Windows test files on the runner drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      # Arms the EncodingWarning gate. Without it the interpreter never emits
      # the warning, and pytest refuses to run.
      - run: uv run pytest --durations=30
        env:
          PYTHONWARNDEFAULTENCODING: "1"

  browser:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser --no-cov
        env:
          PYTHONWARNDEFAULTENCODING: "1"

  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked
      # Skips the uncoded hook. Git ignores the index and the skills it writes,
      # so CI has nothing of its output to check.
      - run: uv run pre-commit run --all-files
        env:
          SKIP: uncoded

  # Builds and runs the package in an environment of its own, which proves the
  # wheel builds, the console script is there, and every runtime dependency
  # resolves outside the one uv sync makes. It builds from this checkout, not
  # from the git URL the README gives, because that URL always names main.
  # hatch-vcs reads the version from the full history.
  package:
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx --from . dreamcatcher --version
