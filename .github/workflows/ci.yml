name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run.
# Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The test job runs every Python on Ubuntu because the standard library
  # differs between versions in the same way on every OS. Platform differences
  # rarely depend on Python version, so pull requests use only the oldest and
  # newest macOS rows; main keeps the full macOS matrix. setup-uv sets
  # UV_PYTHON, which every later uv command obeys over .python-version. The
  # checks and browser jobs take their interpreter from .python-version. The
  # package job takes whatever uvx picks, which is what a user installing the
  # tool gets.
  test:
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"macos-latest","python":"3.13"},{"os":"macos-latest","python":"3.14"}]' || '[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # Fails the job if the environment is not on the matrix interpreter.
      - run: uv run python -c "import sys; assert sys.version.startswith('${{ matrix.python }}.'), sys.version"
        shell: bash
      - name: Keep Windows test files on the runner drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      # Arms the EncodingWarning gate. Without it the interpreter never emits
      # the warning, and pytest refuses to run.
      - run: uv run pytest --durations=30
        env:
          PYTHONWARNDEFAULTENCODING: "1"

  browser:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser --no-cov
        env:
          PYTHONWARNDEFAULTENCODING: "1"

  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --locked
      # Skips the uncoded hook. Git ignores the index and the skills it writes,
      # so CI has nothing of its output to check.
      - run: uv run pre-commit run --all-files
        env:
          SKIP: uncoded

  # Builds and runs the package in an environment of its own, which proves the
  # sdist and the wheel build, the console script is there, and every runtime
  # dependency resolves outside the one uv sync makes. uv build makes the sdist
  # and then builds the wheel from it, so the wheel holds only what the sdist
  # carries, as it would for anyone who installs from the sdist. It builds from
  # this checkout, not from PyPI, which holds only released versions. hatch-vcs
  # reads the version from the full history.
  package:
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv build
      - run: uvx --from dist/*.whl dreamcatcher --version
        shell: bash

  # This job gives branch protection one check for the whole workflow, so its
  # name stays fixed while the jobs above change. Add every new job to `needs`.
  # The job runs even when a needed job fails. GitHub would otherwise skip it,
  # and GitHub counts a skipped required check as passing.
  required-checks-pass:
    name: Required checks pass
    if: always()
    needs: [test, browser, checks, package]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq --exit-status 'map_values(.result) | ., all(.[]; . == "success")' <<< "$NEEDS"
