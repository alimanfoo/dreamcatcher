name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Both jobs take their interpreter from .python-version.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked
      # Arms the EncodingWarning gate. Without it the interpreter never emits
      # the warning, and pytest refuses to run.
      - run: uv run pytest
        env:
          PYTHONWARNDEFAULTENCODING: "1"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files
