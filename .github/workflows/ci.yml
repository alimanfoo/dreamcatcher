name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The test and checks jobs take their interpreter from .python-version. The
  # package job takes whatever uvx picks, which is what a user installing the
  # tool gets.
  test:
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked
      # Arms the EncodingWarning gate. Without it the interpreter never emits
      # the warning, and pytest refuses to run.
      - run: uv run pytest
        env:
          PYTHONWARNDEFAULTENCODING: "1"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files

  # Installs and runs the way the README's install command does. It proves the
  # wheel builds, the console script is there, and every runtime dependency
  # resolves outside the development environment, which uv sync would hide.
  # hatch-vcs reads the version from git, so this needs the whole history.
  package:
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx --from . dreamcatcher --version
