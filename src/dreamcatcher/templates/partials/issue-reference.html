{% macro issue_reference(number) -%}
  {% if view.github_repository_url -%}
    <a class="issue-number" href="{{ view.github_repository_url }}/issues/{{ number }}" target="_blank" rel="noopener noreferrer">#{{ number }}</a>
  {%- else -%}
    <strong class="issue-number">#{{ number }}</strong>
  {%- endif %}
{%- endmacro %}
