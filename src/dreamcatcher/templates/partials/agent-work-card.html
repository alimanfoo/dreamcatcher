{% from "partials/work-card.html" import work_card_rows with context %}<article id="{{ id_prefix }}{{ card.identifier }}" class="agent-work-card{% if card.status.name == "ENDED" %} is-ended{% endif %}" aria-label="{{ card.kind|capitalize }} #{{ card.issue }} {{ card.identifier }}">
  {{ work_card_rows(card) }}
  {% if card.latest_output %}<p class="latest-output"><span>agent</span> {{ card.latest_output }}</p>{% endif %}
</article>
