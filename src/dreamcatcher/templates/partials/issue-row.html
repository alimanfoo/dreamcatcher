<article class="issue-row" aria-label="Issue #{{ issue.issue }}">
  <div class="card-heading">
    <strong class="issue-number">#{{ issue.issue }}</strong>
    <span class="chip issue-{{ issue.status }}">[{{ issue.status|upper }}]</span>
  </div>
  {% if issue.labels %}<p class="labels">{{ issue.labels }}</p>{% endif %}
  {% if issue.evidence %}<p class="evidence">{{ issue.evidence }}</p>{% endif %}
</article>
