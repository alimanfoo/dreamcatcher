<section class="instance" aria-label="Instance">
  <dl class="facts">
    {% for fact in view.instance_facts %}
      <div class="fact{% if fact.is_warning %} warning{% endif %}{% if fact.is_in_progress %} in-progress{% endif %}">
        <dt>{{ fact.label }}</dt>
        <dd>{{ fact.value }}</dd>
      </div>
    {% endfor %}
  </dl>
  {% if view.scheduler_failures %}
    <section class="scheduler-failures" aria-labelledby="scheduler-failures-heading">
      <h1 id="scheduler-failures-heading">scheduler failures</h1>
      <ul>
        {% for failure in view.scheduler_failures %}
          <li>{{ failure }}</li>
        {% endfor %}
      </ul>
    </section>
  {% endif %}
</section>
