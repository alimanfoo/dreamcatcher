[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dreamcatcher"
dynamic = ["version"]
description = "Carry labelled issues to pull requests with autonomous agent assignments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Alistair Miles" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # Flask renders and serves the local web view. pydantic validates the
    # config and every JSON document the tool owns.
    # psutil answers whether a recorded pid is still alive. rich renders the
    # views. pywin32 reaches the Job Object that holds a round on Windows, and
    # installs there alone.
    "flask>=3.1.3",
    "pydantic>=2.0",
    "psutil>=6.0",
    "rich>=13.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
# uv installs this group on a bare `uv sync`, so the tools cannot go missing.
# Pin every tool whose output is enforced or committed.
dev = [
    "complexipy==7.0.1",
    "playwright==1.63.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-playwright==0.9.0",
    "ruff==0.16.3",
    "ty==0.0.73",
    "uncoded==3.0.0",
]

[project.scripts]
dreamcatcher = "dreamcatcher.cli:main"

[project.urls]
Homepage = "https://github.com/alimanfoo/dreamcatcher"
Repository = "https://github.com/alimanfoo/dreamcatcher"

[tool.hatch.version]
source = "vcs"

[tool.uncoded]
source-roots = ["src", "tests", "tools"]
doc-roots = ["README.md", "AGENTS.md", "CONTRACT.md", "docs", "specs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests call the real gh, and browser tests need Chromium. The
# default run leaves both out.
addopts = "--cov -m 'not browser and not integration'"
markers = [
    "browser: runs in an installed browser against a local web server",
    "integration: calls the real gh against this repository, read-only",
]
filterwarnings = ["error::EncodingWarning"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
src = ["src"]
line-length = 88
extend-exclude = [".uncoded"]

[tool.ruff.lint]
preview = true
select = [
    "D",    # pydocstyle (pep257)
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "W",    # pycodestyle warnings
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "FLY",  # flynt
    "PERF", # perflint
    "RUF",  # ruff-specific rules
    "PLE",  # pylint errors
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "PT",   # flake8-pytest-style
    "N",    # pep8-naming
    "complex-structure",
    "unspecified-encoding",
    "redefined-loop-name",
    "import-outside-top-level",
    "collapsible-else-if",
    "useless-return",
    "repeated-equality-comparison",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-statements",
    "too-many-nested-blocks",
]
ignore = [
    "any-type", # too broad to enforce
    # A summary is one sentence, not one line. This rule ends the summary at the
    # first newline, so a summary sentence that wraps reads to it as a
    # description with no blank line before it.
    "missing-blank-line-after-summary",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# dreamcatcher shells out: it drives git, gh, and the harness CLIs the user has
# already signed in. commands.py is the one module that runs them, so it is the
# one place these are waived. Any other module that imports subprocess fails the
# check. commands.py never runs a shell, and it looks the program up on the PATH
# itself. The rules guarding those two stay selected everywhere.
"src/dreamcatcher/commands.py" = [
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
]
# One test spawns a throwaway interpreter, to leave behind a pid no process
# holds. It names the interpreter by its full path, and runs no shell, so the
# rules guarding those two stay selected here as well.
"tests/**" = [
    "D",
    "ANN",
    "assert",
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
]

[tool.complexipy]
max-complexity-allowed = 15
