[build-system]
# Pinned exactly, by the rule on the `dev` dependency group below.
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "dreamcatcher"
dynamic = ["version"]
description = "Dispatch autonomous agent conversations, coding assignments and campaigns from labelled issues"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Alistair Miles" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # filelock holds the daemon lock and coordinates replacement documents.
    # Flask renders and serves the local web view. pydantic validates the
    # config and every JSON document the tool owns. psutil reads when the
    # machine booted, and on Windows finds the thread that starts a round. rich
    # renders the views. On Windows alone, pywin32 reaches the Job Object that
    # holds a round.
    "filelock>=3.32",
    "flask>=3.1.3",
    "pydantic>=2.0",
    "psutil>=6.0",
    "rich>=13.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
# uv installs this group on a bare `uv sync`, so the tools cannot go missing.
# Pin every tool whose output is enforced, committed or published. MkDocs and
# Material build the documentation site. The build backend is such a tool, and
# `[build-system]` pins it, since uv ignores build constraints.
dev = [
    "complexipy==8.0.1",
    "import-linter==2.15",
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "playwright==1.64.0",
    "pre-commit>=4.0",
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-playwright==0.10.0",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.0",
    "ruff==0.17.1",
    "ty==0.0.89",
    "types-pywin32==312.0.0.20261006; sys_platform == 'win32'",
    "uncoded==3.0.1",
]

[project.scripts]
dreamcatcher = "dreamcatcher.cli:main"

# Only collaborators can open an issue, so PyPI links no issue tracker.
[project.urls]
Homepage = "https://alimanfoo.github.io/dreamcatcher/"
Repository = "https://github.com/alimanfoo/dreamcatcher"
Changelog = "https://alimanfoo.github.io/dreamcatcher/changelog/"
Discussions = "https://github.com/alimanfoo/dreamcatcher/discussions"

[tool.hatch.version]
source = "vcs"

# The sdist carries the package alone, beside the files that hatchling reads
# itself, such as README.md and LICENSE. The tests, specs and agent skills stay
# in the repository, as no downstream packager is supported.
[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.uncoded]
source-roots = ["src", "tests", "tools"]
doc-roots = ["README.md", "AGENTS.md", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests call the real gh, and browser tests need Chromium. The
# default run leaves both out. The suite spends its time waiting on child
# processes, so it runs on every processor.
addopts = "--cov -n auto -m 'not browser and not integration'"
markers = [
    "browser: runs in an installed browser against a local web server",
    "integration: calls the real gh against this repository, read-only",
]
filterwarnings = ["error::EncodingWarning"]
# Fails the run on an unknown setting or marker, an xfail test that passes, or
# two parametrized cases with one ID. A misspelled marker would otherwise put a
# test that calls the real gh into the default run.
strict = true
# docs/testing.md says what happens when a test hangs, and how to lift the
# limit. Keep the stack dump below the timeout.
timeout = 120
faulthandler_timeout = 110

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 88
extend-exclude = [".uncoded"]

[tool.ruff.lint]
preview = true
select = [
    "D",    # pydocstyle (pep257)
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "W",    # pycodestyle warnings
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "FLY",  # flynt
    "PERF", # perflint
    "RUF",  # ruff-specific rules
    "PLE",  # pylint errors
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "T10",  # flake8-debugger
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "PT",   # flake8-pytest-style
    "N",    # pep8-naming
    "complex-structure",
    "unspecified-encoding",
    "redefined-loop-name",
    "import-outside-top-level",
    "collapsible-else-if",
    "useless-return",
    "repeated-equality-comparison",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-statements",
    "too-many-nested-blocks",
]
ignore = [
    "any-type", # too broad to enforce
    # A summary is one sentence, not one line. This rule ends the summary at the
    # first newline, so a summary sentence that wraps reads to it as a
    # description with no blank line before it.
    "missing-blank-line-after-summary",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# Every import names its module from the top of the package, so each import
# has one spelling, as AGENTS.md asks of every way to do a thing. A search for
# a module's dotted name then finds every module that imports it.
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# dreamcatcher shells out: it drives git, gh, and the harness CLIs the user has
# already signed in. commands.py is the one module that runs them, so it is the
# one place these are waived. Any other module that imports subprocess fails the
# check. commands.py never runs a shell, and it looks the program up on the PATH
# itself. The rules guarding those two stay selected everywhere.
"src/dreamcatcher/commands.py" = [
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
]
# One test spawns a throwaway interpreter, to leave behind a pid no process
# holds. It names the interpreter by its full path, and runs no shell, so the
# rules guarding those two stay selected here as well.
"tests/**" = [
    "D",
    "ANN",
    "assert",
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
]
[tool.complexipy]
max-complexity-allowed = 15

# Each contract states one dependency rule of the architecture, which
# docs/architecture.md describes. The lint-imports commit hook checks them.
[tool.importlinter]
root_package = "dreamcatcher"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The scheduler never reaches the daemon or status"
type = "forbidden"
source_modules = ["dreamcatcher.scheduler"]
forbidden_modules = ["dreamcatcher.daemon", "dreamcatcher.status"]

[[tool.importlinter.contracts]]
name = "Agent work never reaches scheduling"
type = "forbidden"
source_modules = [
    "dreamcatcher.agent_assignment_pull_requests",
    "dreamcatcher.agent_assignments",
    "dreamcatcher.agent_rounds",
    "dreamcatcher.agent_work",
    "dreamcatcher.campaigns",
    "dreamcatcher.issue_conversations",
]
forbidden_modules = ["dreamcatcher.scheduler"]

[[tool.importlinter.contracts]]
name = "Adapters never reach presentation or scheduling"
type = "forbidden"
source_modules = [
    "dreamcatcher.claude",
    "dreamcatcher.codex",
    "dreamcatcher.github",
    "dreamcatcher.harness_adapters",
    "dreamcatcher.harnesses",
]
forbidden_modules = ["dreamcatcher.scheduler", "dreamcatcher.tui", "dreamcatcher.web"]

[[tool.importlinter.contracts]]
name = "Setup never reaches presentation, scheduling or the daemon"
type = "forbidden"
source_modules = ["dreamcatcher.repository_setup"]
forbidden_modules = [
    "dreamcatcher.daemon",
    "dreamcatcher.scheduler",
    "dreamcatcher.tui",
    "dreamcatcher.web",
]

[[tool.importlinter.contracts]]
name = "Status and the feed never reach presentation"
type = "forbidden"
source_modules = ["dreamcatcher.feed", "dreamcatcher.status"]
forbidden_modules = ["dreamcatcher.tui", "dreamcatcher.web"]

[[tool.importlinter.contracts]]
name = "Storage reaches only documents and errors"
type = "forbidden"
source_modules = ["dreamcatcher.documents", "dreamcatcher.errors", "dreamcatcher.state"]
forbidden_modules = ["dreamcatcher.*"]
ignore_imports = [
    "dreamcatcher.* -> dreamcatcher.documents",
    "dreamcatcher.* -> dreamcatcher.errors",
]

# Presentation shows what status and the feed derive. Both presentations reach
# the scheduler and GitHub through status, so these two contracts check direct
# imports alone.
[[tool.importlinter.contracts]]
name = "The TUI imports no policy module and not the web"
type = "forbidden"
source_modules = ["dreamcatcher.tui"]
forbidden_modules = [
    "dreamcatcher.daemon",
    "dreamcatcher.github",
    "dreamcatcher.scheduler",
    "dreamcatcher.web",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The web imports no policy module and not the TUI"
type = "forbidden"
source_modules = ["dreamcatcher.web"]
forbidden_modules = [
    "dreamcatcher.daemon",
    "dreamcatcher.github",
    "dreamcatcher.scheduler",
    "dreamcatcher.tui",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the TUI imports Rich"
type = "protected"
protected_modules = ["rich"]
allowed_importers = ["dreamcatcher.tui"]

[[tool.importlinter.contracts]]
name = "Only the web imports Flask"
type = "protected"
protected_modules = ["flask"]
allowed_importers = ["dreamcatcher.web"]

# Status reads the scheduler's records and derivations, which faults and models
# hold, and never the modules that choose or start work.
[[tool.importlinter.contracts]]
name = "Status reads only the scheduler's records and derivations"
type = "forbidden"
source_modules = ["dreamcatcher.status"]
forbidden_modules = ["dreamcatcher.scheduler"]
ignore_imports = [
    "dreamcatcher.status.** -> dreamcatcher.scheduler.faults",
    "dreamcatcher.status.** -> dreamcatcher.scheduler.models",
]
allow_indirect_imports = true
