[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dreamcatcher"
dynamic = ["version"]
description = "Carry labelled issues to pull requests with autonomous agent sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Alistair Miles" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = [
    "complexipy==7.0.1",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff==0.16.3",
    "ty>=0.0.73",
    # uncoded needs Python 3.12; the package itself supports 3.11, so the
    # index is synced on a development or lint environment, never on 3.11.
    "uncoded>=2.1.1; python_version >= '3.12'",
]

[project.scripts]
dreamcatcher = "dreamcatcher.cli:main"

[project.urls]
Homepage = "https://github.com/alimanfoo/dreamcatcher"
Repository = "https://github.com/alimanfoo/dreamcatcher"

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov"
filterwarnings = ["error::EncodingWarning"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
