[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dreamcatcher"
dynamic = ["version"]
description = "Carry labelled issues to pull requests with autonomous agent sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Alistair Miles" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # pydantic validates the config and every JSON document the tool owns.
    # psutil answers whether a recorded pid is still alive.
    "pydantic>=2.0",
    "psutil>=6.0",
]

[dependency-groups]
# uv installs this group on a bare `uv sync`, so the tools cannot go missing.
# Pin every tool whose output is enforced or committed.
dev = [
    "complexipy==7.0.1",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff==0.16.3",
    "ty==0.0.73",
    "uncoded==2.1.1",
]

[project.scripts]
dreamcatcher = "dreamcatcher.cli:main"

[project.urls]
Homepage = "https://github.com/alimanfoo/dreamcatcher"
Repository = "https://github.com/alimanfoo/dreamcatcher"

[tool.hatch.version]
source = "vcs"

[tool.uncoded]
source-roots = ["src", "tests", "tools"]
doc-roots = ["README.md", "AGENTS.md", "specs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The integration tests call the real gh, which no CI runner is signed in to, so
# the default run leaves them out. Ask for them by name to run them.
addopts = "--cov -m 'not integration'"
markers = ["integration: calls the real gh against this repository, read-only"]
filterwarnings = ["error::EncodingWarning"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
src = ["src"]
line-length = 88
extend-exclude = [".uncoded"]

[tool.ruff.lint]
preview = true
select = [
    "D",    # pydocstyle (pep257)
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "W",    # pycodestyle warnings
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "FLY",  # flynt
    "PERF", # perflint
    "RUF",  # ruff-specific rules
    "PLE",  # pylint errors
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "PT",   # flake8-pytest-style
    "N",    # pep8-naming
    "complex-structure",
    "unspecified-encoding",
    "redefined-loop-name",
    "import-outside-top-level",
    "collapsible-else-if",
    "useless-return",
    "repeated-equality-comparison",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-statements",
    "too-many-nested-blocks",
]
ignore = [
    "any-type", # too broad to enforce
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Shelling out is what dreamcatcher does: it drives git, gh, and the harness
# CLIs the user has already signed in. commands.py is the one module that runs
# them, so it is the one place these are waived, and any other module that
# imports subprocess fails the check. It never runs a shell, and it finds the
# program on the PATH itself, so the two rules guarding those stay selected.
"src/dreamcatcher/commands.py" = [
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
]
# The test helpers run git and a throwaway interpreter, each found on PATH by
# name. A shell invocation is a different rule, and stays selected everywhere.
"tests/**" = [
    "D",
    "ANN",
    "assert",
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
    "start-process-with-partial-path",
]

[tool.complexipy]
max-complexity-allowed = 15
