repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix --show-fixes
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ty
        name: ty
        entry: uv run ty check src tests
        language: system
        pass_filenames: false
      - id: complexipy
        name: complexipy
        entry: uv run complexipy src tests
        language: system
        pass_filenames: false
      - id: remark-validate-links
        name: validate markdown links
        entry: remark --frail --quiet --no-stdout --use validate-links
        language: node
        additional_dependencies:
          - remark-cli@12.0.1
          - remark-validate-links@13.1.0
        files: \.md$
      # Runs before uncoded so the generated skill files are built from
      # already-formatted sources.
      - id: prettier
        name: format markdown with prettier
        entry: prettier --write
        language: node
        additional_dependencies: ["prettier@3.8.1"]
        files: \.md$
      - id: uncoded
        name: uncoded
        entry: uv run uncoded sync
        language: system
        pass_filenames: false
