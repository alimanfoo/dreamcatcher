<!doctype html>
<html lang="en">

      <div class="fact">

        <dd>claude</dd>
      </div>
    
      <div class="fact">
        <dt>latest scheduler tick</dt>
        <dd>none recorded</dd>
      </div>
    
      <div class="fact">
        <dt>agent capacity</dt>
        <dd>0 of 1 in use</dd>
      </div>
    
      <div class="fact">
        <dt>global cooldown</dt>
        <dd>none</dd>
      </div>
    
  </dl>
</section>

        <section class="panel" aria-labelledby="assignments-heading">

        <section class="panel" aria-labelledby="issues-heading">

          </div>
        </section>

  </main>
  <script src="/static/home.js"></script>

</html>
